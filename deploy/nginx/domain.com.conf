# =============================================================
# HTTP → HTTPS redirect (all hosts incl. *.domain.com)
# =============================================================
server {
    listen 80;
    listen [::]:80;
    server_name domain.com www.domain.com *.domain.com;

    # Reject all non-HTTPS traffic at nginx level
    return 301 https://$host$request_uri;
}

# =============================================================
# Main site (domain.com + www only) — backend (port 3000)
# =============================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name domain.com www.domain.com;

    # --- TLS hardening ---
    ssl_certificate         /etc/letsencrypt/live/domain.com/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/domain.com/privkey.pem;
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_ciphers             'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache       shared:SSL:10m;
    ssl_session_timeout     1d;
    # OCSP stapling
    ssl_stapling            on;
    ssl_stapling_verify     on;
    resolver                8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout        5s;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "DENY"                             always;
    add_header X-Content-Type-Options      "nosniff"                          always;
    add_header Content-Security-Policy     "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    add_header Referrer-Policy             "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy          "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-XSS-Protection           "0"                                always;       # CSP covers XSS

    # --- Timeout hardening (Slowloris / slow-read protection) ---
    client_body_timeout    10;
    client_header_timeout  10;
    keepalive_timeout      15;
    send_timeout           10;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# =============================================================
# Subdomain wildcard catch-all — frontend (port 4000)
# Only matches subdomains explicitly created by the platform.
# Unknown subdomains get a generic 404 without proxying upstream.
# =============================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.domain.com;

    # --- TLS hardening (same as main) ---
    ssl_certificate         /etc/letsencrypt/live/domain.com/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/domain.com/privkey.pem;
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_ciphers             'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache       shared:SSL:10m;
    ssl_session_timeout     1d;
    ssl_stapling            on;
    ssl_stapling_verify     on;
    resolver                8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout        5s;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "DENY"                             always;
    add_header X-Content-Type-Options      "nosniff"                          always;
    add_header Content-Security-Policy     "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    add_header Referrer-Policy             "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy          "camera=(), microphone=(), geolocation=(), payment=()" always;

    # --- Timeout hardening ---
    client_body_timeout    10;
    client_header_timeout  10;
    keepalive_timeout      15;
    send_timeout           10;

    location / {
        # Only proxy subdomains that have an explicit upstream.
        # For unknown DNS wildcards, return a generic 404.
        if ($host !~* ^([a-z0-9][-a-z0-9]+)\.domain\.com$ ) {
            return 404;
        }

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
