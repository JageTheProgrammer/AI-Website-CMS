# Install as /etc/nginx/sites-available/maatix.fi and enable it after
# creating a TLS certificate that covers maatix.fi and *.maatix.fi.

server {
    listen 80;
    listen [::]:80;
    server_name maatix.fi www.maatix.fi *.maatix.fi;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name maatix.fi www.maatix.fi;

    ssl_certificate /etc/letsencrypt/live/maatix.fi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maatix.fi/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.maatix.fi;

    ssl_certificate /etc/letsencrypt/live/maatix.fi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maatix.fi/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
